# SonarQube project configuration — Gate 4/5 wiring (FlyReserve web).
#
# This branch (feat/sah-19-booking-flow-web-shell) carries the apps/web
# frontend workspace only. When it merges alongside the backend workspace,
# this file will be superseded by the repo-root sonar-project.properties
# that fans out to every service (see feat/sah-20 for the multi-service
# shape). The dual entries below are placeholders until the merged file
# lands via the workspace-root PR tracked by Engineering Manager (SAH-38 F2).
sonar.projectKey=flyreserve
sonar.projectName=FlyReserve
sonar.projectVersion=0.1.0

# Sources / tests covered by this branch. Only apps/web is populated here;
# backend paths are listed so a downstream merge does not require rewriting
# this file when they land.
sonar.sources=apps/web/src
sonar.tests=apps/web/src
sonar.test.inclusions=apps/web/src/**/*.{test,spec}.{ts,tsx}
sonar.language=ts

# Coverage report from vitest v8 (see apps/web/vitest.config.ts).
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

# Files excluded from coverage: bootstrap only, no assertable behavior.
sonar.coverage.exclusions=apps/web/src/main.tsx,apps/web/src/routes/index.tsx

sonar.qualitygate.wait=true
