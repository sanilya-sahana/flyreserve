# SonarQube project configuration — Gate 4/5 wiring (FlyReserve monorepo)
sonar.projectKey=flyreserve
sonar.projectName=FlyReserve
sonar.projectVersion=0.1.0

sonar.sources=src,apps/web/src
sonar.tests=tests,apps/web/src
sonar.test.inclusions=tests/**/*.{test,spec}.ts,apps/web/src/**/*.{test,spec}.{ts,tsx}
sonar.language=ts

# Coverage reports from all apps
sonar.javascript.lcov.reportPaths=coverage/lcov.info,apps/web/coverage/lcov.info

sonar.coverage.exclusions=src/index.ts,apps/web/src/main.tsx,apps/web/src/routes/index.tsx

sonar.qualitygate.wait=true
