services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://flyreserve:changeme@db:5432/flyreserve
      AUTH_BYPASS: "true" # dev-only; never use in staging/prod
      INTERNAL_API_SECRET: changeme-internal-secret
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: flyreserve
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: flyreserve
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyreserve -d flyreserve"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
